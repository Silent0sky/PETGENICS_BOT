services:
  - type: web
    name: petgenics-order-bot
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petgenics-postgres
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: HEALTH_CHECK_TOKEN
        generateValue: true
      - key: WEBHOOK_URL
        value: https://petgenics-order-bot.onrender.com

databases:
  - name: petgenics-postgres
    plan: basic-256mb
    databaseName: petgenics
    user: petgenics
